name: Build and deploy github pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-v0.14.0
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: |
          if curl --retry 3 --retry-all-errors -sSfL https://github.com/drager/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz | tar xz; then
            mv wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack ~/.cargo/bin/wasm-pack
          else
            cargo install wasm-pack --version 0.14.0 --locked
          fi
      - name: Install
        run: npm i
      # 失敗したらデプロイしない。TS と Rust で二重に持っている手番判定
      # (app/src/model/check.ts) が Rust 実装と一致するかを確かめる。
      - name: Test
        run: npm run test:web
      - name: Build
        env:
          FMRS_API_BASE_URL: https://fmrs-api-1045417562870.asia-northeast1.run.app
        run: |
          npm run build
          rm ./docs/.gitignore
          rm ./docs/pkg/.gitignore
      - name: Preserve dev directory from gh-pages
        run: |
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          git checkout FETCH_HEAD -- dev/ 2>/dev/null || true
          if [ -d dev ]; then
            mkdir -p docs/dev
            cp -r dev/. docs/dev/
          fi
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: docs
