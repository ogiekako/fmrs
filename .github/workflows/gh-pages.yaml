name: Build and deploy github pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
      - name: Install & Build
        env:
          FMRS_API_BASE_URL: https://fmrs-api-1045417562870.asia-northeast1.run.app
        run: |
          npm i
          npm run build
          rm ./docs/.gitignore
          rm ./docs/pkg/.gitignore
      - name: Preserve dev directory from gh-pages
        run: |
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          git checkout FETCH_HEAD -- dev/ 2>/dev/null || true
          if [ -d dev ]; then
            mkdir -p docs/dev
            cp -r dev/. docs/dev/
          fi
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: docs
